[project]
name = "code-debugger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "surabhisarnot", email = "surabhisarnot@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi==0.115.6",
    "pydantic>=2.9",
    "python-dotenv==1.0.1",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
code-debugger = "code_debugger:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
